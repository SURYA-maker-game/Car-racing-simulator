<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Grand Prix</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="panel speed"><strong id="speed">0</strong><span>KM/H</span></div>
    <div class="panel lap"><span>LAP</span><strong><b id="lap">1</b>/3</strong></div>
    <div class="panel stats"><div>SCORE <b id="score">0</b></div><div>BEST <b id="best">0</b></div><div>TIME <b id="time">0:00</b></div></div>
    <div class="panel controls">← → / A D steer<br>↑ / W accelerate<br>SPACE nitro</div>
    <div class="nitro"><i id="nitro"></i></div>
  </div>
  <div class="menu" id="menu">
    <div class="card">
      <p class="eyebrow">NIGHT CIRCUIT</p>
      <h1>NEON <em>GRAND PRIX</em></h1>
      <label>Driver name <input id="name" maxlength="18" value="Driver"></label>
      <label>Race room <input id="room" maxlength="16" value="RACE"></label>
      <button id="start">START ENGINE</button>
      <p id="connection" class="connection">Connecting…</p>
    </div>
  </div>
  <div class="finish" id="finish"><div class="card"><h1 id="result">RACE OVER</h1><button id="restart">RACE AGAIN</button></div></div>
  <script src="/game.js"></script>
</body>
</html>
