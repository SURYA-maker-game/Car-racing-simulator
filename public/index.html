<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Grand Prix</title>
  <style>
    :root { --cyan:#27e5ff; --pink:#ff3aa7; --yellow:#ffd166; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; background:#050713; color:white; font-family:Inter,system-ui,sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    .hud { position:fixed; inset:0; pointer-events:none; padding:22px; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; }
    .panel { background:rgba(7,12,28,.82); border:1px solid rgba(39,229,255,.28); border-radius:14px; backdrop-filter:blur(12px); box-shadow:0 12px 40px rgba(0,0,0,.25); }
    .speed { width:154px; padding:14px 18px; }
    .speed strong { display:block; font-size:38px; line-height:1; font-style:italic; }
    .speed span { color:#aeb8d0; font-size:12px; letter-spacing:2px; }
    .race { padding:12px 18px; text-align:center; }
    .race small { color:#9da8c2; letter-spacing:2px; }
    .race strong { display:block; margin-top:3px; font-size:24px; }
    .score { position:absolute; right:22px; top:106px; width:154px; padding:12px 14px; }
    .score div { display:flex; justify-content:space-between; margin:5px 0; color:#b9c3dc; font-size:13px; }
    .score b { color:white; }
    .controls { position:absolute; bottom:22px; left:22px; padding:10px 13px; color:#9da8c2; font-size:12px; }
    .nitro { position:absolute; bottom:22px; right:22px; width:220px; height:12px; border-radius:20px; padding:3px; background:rgba(3,7,19,.8); border:1px solid rgba(39,229,255,.35); }
    .nitro i { display:block; height:100%; width:100%; border-radius:20px; background:linear-gradient(90deg,var(--cyan),var(--pink)); box-shadow:0 0 16px var(--cyan); }
    .menu { position:fixed; inset:0; display:grid; place-items:center; background:linear-gradient(135deg,rgba(4,7,20,.9),rgba(17,8,35,.72)); transition:.25s; }
    .menu.hidden { opacity:0; pointer-events:none; }
    .card { width:min(620px,calc(100vw - 32px)); text-align:center; padding:44px; }
    h1 { margin:0; font-size:clamp(42px,8vw,82px); line-height:.86; font-style:italic; letter-spacing:-5px; text-transform:uppercase; }
    h1 em { color:var(--cyan); font-style:inherit; text-shadow:0 0 24px rgba(39,229,255,.5); }
    .tag { color:#afb8ce; letter-spacing:6px; font-size:12px; margin:18px 0 28px; }
    .menu button { pointer-events:auto; border:0; border-radius:8px; padding:15px 28px; color:#061018; background:var(--cyan); font-weight:900; letter-spacing:1px; cursor:pointer; box-shadow:0 0 30px rgba(39,229,255,.28); }
    .menu button:hover { transform:translateY(-2px); }
    .gameover { position:absolute; inset:0; display:none; place-items:center; background:rgba(3,5,15,.66); pointer-events:auto; }
    .gameover.show { display:grid; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <div class="panel speed"><strong id="speed">0</strong><span>KM/H</span></div>
      <div class="panel race"><small>LAP</small><strong><span id="lap">1</span>/3</strong></div>
    </div>
    <div class="panel score">
      <div><span>SCORE</span><b id="score">0</b></div>
      <div><span>BEST</span><b id="best">0</b></div>
      <div><span>TIME</span><b id="time">0:00</b></div>
    </div>
    <div class="panel controls">← → steer &nbsp; • &nbsp; ↑ accelerate &nbsp; • &nbsp; SPACE nitro</div>
    <div class="nitro"><i id="nitro"></i></div>
  </div>
  <div class="menu" id="menu">
    <div class="card panel">
      <h1>Neon <em>Grand Prix</em></h1>
      <div class="tag">NIGHT CIRCUIT · 3 LAPS</div>
      <button id="start">START ENGINE</button>
    </div>
  </div>
  <div class="gameover" id="gameover">
    <div class="card panel">
      <h1 id="result">Race <em>Over</em></h1>
      <button id="restart">RACE AGAIN</button>
    </div>
  </div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,scale;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;scale=devicePixelRatio;ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);
let state='menu',last=0,distance=0,speed=0,score=0,best=+(localStorage.racingBest||0),nitro=100,lap=1,roadOffset=0,elapsed=0;
$('best').textContent=best;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLower]=1;keys[e.code]=1;e.preventState&&(e.preventDefault())});addEventListener('keyup',e=>{keys[e.key.toLower]=0;keys[e.code]=0});
const player={x:0,y:.72,w:54,h:96};
let traffic=[],particles=[];
function reset(){distance=0;speed=0;score=0;nitro=100;lap=1;elapsed=0;roadOffset=0;traffic=[];particles=[];player.x=0;state='racing';$('gameover').classList.remove('show');$('menu').classList.add('hidden')}
$('start').onclick=reset;$('restart').onclick=reset;
function spawnTraffic(){const lane=[-.66,-.33,0,.33,.66][Math.floor(Math.random()*5)];traffic.push({lane,y:-140,w:48,h:82,color:['#ff4d9d','#ffb84d','#4dffb8','#7c69ff'][Math.floor(Math.random()*4)],drift:(Math.random()-0.5)*.002})}
function roadPoint(y){const horizon=H/scale*.22;const t=Math.max(0,Math.min(1,(y-horizon)/(H/scale-horizon)));return W/scale/2+(player.x*0)+(t*t*0)}
function drawBackground(){const w=W/scale,h=H/scale,horizon=h*.22;ctx.fillStyle='#090a18';ctx.fillRect(0,0,w,h);let g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,'#1a1642');g.addColorStop(.35,'#11172a');g.addColorStop(1,'#050713');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h-horizon);
  ctx.fillStyle='rgba(82,93,150,.18)';for(let i=-10;i<10;i++){ctx.beginPath();ctx.moveTo(w/2+i*20,horizon);ctx.lineTo(w/2+i*95,h);ctx.lineTo(w/2+i*95+8,h);ctx.lineTo(w/2+i*20+2,horizon);ctx.fill()}
}
function roadEdges(w,h,horizon){const cx=w/2,halfTop=90,halfBottom=w*.43;ctx.fillStyle='#15162b';ctx.beginPath();ctx.moveTo(cx-halfTop,horizon);ctx.lineTo(cx+halfTop,horizon);ctx.lineTo(cx+halfBottom,h);ctx.lineTo(cx-halfBottom,h);ctx.closePath();ctx.fill();ctx.fillStyle='#dbddea';ctx.beginPath();ctx.moveTo(cx-halfTop,horizon);ctx.lineTo(cx-halfTop+5,horizon);ctx.lineTo(cx-halfBottom+12,h);ctx.lineTo(cx-halfBottom,h);ctx.fill();ctx.beginPath();ctx.moveTo(cx+halfTop,horizon);ctx.lineTo(cx+halfTop-5,horizon);ctx.lineTo(cx+halfBottom-12,h);ctx.lineTo(cx+halfBottom,h);ctx.fill();}
function drawRoad(w,h){const horizon=h*.22;roadEdges(w,h,horizon);const offset=(roadOffset*3)%140;ctx.fillStyle='rgba(255,255,255,.48)';for(let i=-2;i<8;i++){const y=horizon+(i*140+offset)%((h-horizon));const t=Math.max(0,(y-horizon)/(h-horizon));const yy=y,yy2=y+18+40*t,hw=(90+(w*.43-90)*t)*.012;const cx=w/2;for(let lane=-2;lane<=2;lane+=1){const x=cx+lane*(10+(w*.43-10)*t)*.72;ctx.beginPath();ctx.moveTo(x-hw,yy);ctx.lineTo(x+hw,yy);ctx.lineTo(x+hw*(1+t),yy2);ctx.lineTo(x-hw*(1+t),yy2);ctx.fill()}}}
function projectLane(lane,y,horizon){const h=H/scale,t=Math.max(0,Math.min(1.3,(y-horizon)/(h-horizon)));const roadHalf=90+(W/scale*.43-90)*t;return W/scale/2+lane*roadHalf*.82}
function drawCar(x,y,w,h,color,playerCar=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=playerCar?'#27e5ff':color;ctx.shadowBlur=playerCar?18:8;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,h*.42,w*.58,h*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-w*.38,-h*.45);ctx.lineTo(w*.38,-h*.45);ctx.lineTo(w*.5,-h*.18);ctx.lineTo(w*.43,h*.42);ctx.lineTo(-w*.43,h*.42);ctx.lineTo(-w*.5,-h*.18);ctx.closePath();ctx.fill();ctx.fillStyle='#09111e';ctx.beginPath();ctx.moveTo(-w*.27,-h*.35);ctx.lineTo(w*.27,-h*.35);ctx.lineTo(w*.34,-h*.05);ctx.lineTo(-w*.34,-h*.05);ctx.closePath();ctx.fill();ctx.fillStyle='#ff466e';ctx.fillRect(-w*.34,h*.34,w*.16,h*.06);ctx.fillRect(w*.18,h*.34,w*.16,h*.06);ctx.restore()}
function update(dt){if(state!=='racing')return;elapsed+=dt;let accelerating=keys.ArrowUp||keys.KeyW,braking=keys.ArrowDown||keys.KeyS,boost=(keys[' ']||keys.Space)&&nitro>0;
  if(accelerating)speed+=95*dt;else speed-=38*dt;if(braking)speed-=180*dt;if(boost){speed+=130*dt;nitro-=35*dt}else nitro=Math.min(100,nitro+10*dt);speed=Math.max(0,Math.min(boost?290:230,speed));
  const steer=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);player.x+=steer*dt*(1.1+speed/260);player.x=Math.max(-.82,Math.min(.82,player.x));roadOffset+=speed*dt*.012;distance+=speed*dt*.001;
  lap=Math.min(3,Math.floor(distance/1.2)+1);if(distance>=3.6){finish(true)}
  if(Math.random()<dt*(.24+speed/350))spawnTraffic();const h=H/scale,horizon=h*.22;traffic.forEach(t=>{t.y+=dt*(speed*.12+80)*(h*.0013);t.lane+=t.drift;const px=projectLane(t.lane,t.y,horizon),py=t.y;if(Math.abs(px-(W/scale/2+player.x*(W/scale*.43*.82)))<38&&Math.abs(py-(h*.72))<70){finish(false)}});traffic=traffic.filter(t=>t.y<h+130);
  score=Math.floor(distance*1200+elapsed*20);if(score>best){best=score;localStorage.racingBest=best}$('speed').textContent=Math.round(speed);$('score').textContent=score;$('best').textContent=best;$('lap').textContent=lap;$('nitro').style.width=nitro+'%';const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60).toString().padStart(2,'0');$('time').textContent=m+':'+s}
function finish(won){if(state!=='racing')return;state='over';$('gameover').querySelector('h1').innerHTML=won?'Race <em>Complete</em>':'Race <em>Over</em>';$('gameover').classList.add('show')}
function draw(){const w=W/scale,h=H/scale;drawBackground();drawRoad(w,h);const horizon=h*.22;traffic.sort((a,b)=>a.y-b.y).forEach(t=>{const py=t.y,pv=Math.max(.18,Math.min(1.2,(py-horizon)/(h-horizon)));drawCar(projectLane(t.lane,py,horizon),py,t.w*pv,t.h*pv,t.color,false)});drawCar(w/2+player.x*w*.43*.82,h*.72,54,96,'#27e5ff',true);requestAnimationFrame(loop)}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw()}requestAnimationFrame(loop);
</script>
</body>
</html>
